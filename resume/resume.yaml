skillsMain:
  - name: Geology Skills
    level: High level expertise
    keywords:
      - Seismic interpretation (2D-3D)
      - AVO analysis
      - Well Ties
      - Geo-Modelling with complex multiple grids
      - Petroleum System Analysis-basic migration models
      - Addressing the main risk elements (source/seal/pathway/trap)
      - Data integration
      - Database building

  - name: Geoscience Software
    level: Primary expertise
    software:
      - name: IHS Kingdom
        experience: 10+ years
        description: Extensive experience in basic interpretation workflows including time-depth conversions, synthetic well ties, and volume calculations. Proficient in professional data loading and QC procedures, well data management, and attribute calculations. Conducted AVO analysis on Pre-Stack data and generated prospects based on analogs from the same dataset, ensuring context-driven interpretations.

      - name: PaleoScan
        experience: Advanced workflows
        description: Developed advanced skillset during the interpretation of a 500 km² Romanian 3D seismic dataset. Created horizon stacks and DRS surfaces to investigate geomorphology through actual interpreted horizons rather than just time slices. Applied spectral decomposition with RGB blending to delineate geological features (channels, lobes) and assess depositional environments. Performed alternative AVO analysis using crossplot toolsets to compare gas/oil analogues with prospects across multiple seismic attributes.

      - name: ZetaWare PSA Toolset
        experience: Basin and prospect scale
        description: Used 1D modeling tool and hotspot data analysis for regional basin-scaled overviews on fluid types and temperature models. Applied 3D package to visualize petroleum system models and fluid distribution in relation to temperatures and horizons. Created hydrocarbon migration risk maps for both local prospect-scale and regional-scale interpretations, including major projects in the Derecske trough and Romanian EX-1 and EX-5 areas.

      - name: Petromod & Migris
        experience: Project-based
        description: Applied Petromod 1D modeling tool for dissertation work. Collaborated with Migris group from Norway using academic license to create hydrocarbon migration models for the Jászság Basin, developing expertise in modeling possible hydrocarbon migration pathways.

      - name: QGIS
        experience: 2+ years database management
        description: Served as responsible person for GIS database management at OGD and SHPR companies. Produced professional maps using developed template systems and maintained SQL databases with regular updates. Performed standard GIS tasks including measuring, comparing, visualizing geological features, and coordinate conversions between different UTM zones.

